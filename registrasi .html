<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire - Registration</title>
    <style>
        body {
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #FF4500 0%, #FF0000 50%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #FFF;
            overflow: hidden;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://via.placeholder.com/1920x1080/FF4500/FFFFFF?text=Free+Fire+Flames') no-repeat center center;
            background-size: cover;
            opacity: 0.3;
            pointer-events: none;
        }
        form {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(255, 69, 0, 0.5);
            width: 400px;
            border: 3px solid #FF4500;
            position: relative;
            z-index: 1;
            text-align: center;
        }
        .logo {
            width: 100px;
            height: 100px;
            background: url('https://via.placeholder.com/100x100/FF0000/FFFFFF?text=FF+Logo') no-repeat center center;
            background-size: cover;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 2px solid #FFA500;
        }
        h2 {
            text-shadow: 0 0 10px #FF4500;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #FFA500;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #FF4500;
            border-radius: 8px;
            box-sizing: border-box;
            background: #222;
            color: #FFF;
            font-family: 'Arial Black', sans-serif;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 15px #FF4500;
            border-color: #FFA500;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #FF0000, #FFA500);
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 5px #FFF;
        }
        button:hover {
            background: linear-gradient(45deg, #FFA500, #FF0000);
            box-shadow: 0 0 20px #FF4500;
        }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #FFA500;
        }
    </style>
</head>
<body>
    <form action="/register" method="post">
        <div class="logo"></div>
        <h2>Join the Free Fire Squad!</h2>
        <label for="username">Player ID:</label>
        <input type="text" id="username" name="username" required placeholder="Create Your Alias">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="your.email@freefire.com">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="Strong Password">

        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter Password">

        <button type="submit">Register & Conquer!</button>
        <div class="footer">[Powered by Free Fire - Survive the Battle]</div>
    </form>
</body>
</html>
