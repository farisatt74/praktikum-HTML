<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire - Sign In & Sign Up</title>
    <style>
        body {
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #FF4500 0%, #FF0000 50%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #FFF;
            overflow: hidden;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://via.placeholder.com/1920x1080/FF4500/FFFFFF?text=Free+Fire+Flames') no-repeat center center;
            background-size: cover;
            opacity: 0.3;
            pointer-events: none;
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(255, 69, 0, 0.5);
            width: 400px;
            text-align: center;
            border: 3px solid #FF4500;
            position: relative;
            z-index: 1;
        }
        .logo {
            width: 100px;
            height: 100px;
            background: url('https://via.placeholder.com/100x100/FF0000/FFFFFF?text=FF+Logo') no-repeat center center;
            background-size: cover;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 2px solid #FFA500;
        }
        .toggle {
            margin-bottom: 20px;
        }
        .toggle button {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            color: #FFA500;
            text-transform: uppercase;
        }
        .toggle button.active {
            color: #FF0000;
            border-bottom: 3px solid #FF0000;
            text-shadow: 0 0 10px #FF4500;
        }
        form {
            display: none;
        }
        form.active {
            display: block;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #FFA500;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #FF4500;
            border-radius: 8px;
            box-sizing: border-box;
            background: #222;
            color: #FFF;
            font-family: 'Arial Black', sans-serif;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 15px #FF4500;
            border-color: #FFA500;
        }
        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #FF0000, #FFA500);
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 5px #FFF;
        }
        button[type="submit"]:hover {
            background: linear-gradient(45deg, #FFA500, #FF0000);
            box-shadow: 0 0 20px #FF4500;
        }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #FFA500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"></div>
        <div class="toggle">
            <button id="signin-btn" class="active">Enter Battle (Sign In)</button>
            <button id="signup-btn">Join Squad (Sign Up)</button>
        </div>

        <form id="signin-form" class="active" action="/login" method="post">
            <h2>Sign In to Free Fire</h2>
            <label for="signin-username">Player ID or Email:</label>
            <input type="text" id="signin-username" name="username" required placeholder="Your Player ID">

            <label for="signin-password">Password:</label>
            <input type="password" id="signin-password" name="password" required placeholder="Secure Code">

            <button type="submit">Enter the Battle!</button>
        </form>

        <form id="signup-form" action="/register" method="post">
            <h2>Sign Up for Free Fire</h2>
            <label for="signup-username">Player ID:</label>
            <input type="text" id="signup-username" name="username" required placeholder="Create Your Alias">

            <label for="signup-email">Email:</label>
            <input type="email" id="signup-email" name="email" required placeholder="your.email@freefire.com">

            <label for="signup-password">Password:</label>
            <input type="password" id="signup-password" name="password" required placeholder="Strong Password">

            <label for="signup-confirm">Confirm Password:</label>
            <input type="password" id="signup-confirm" name="confirm_password" required placeholder="Re-enter Password">

            <button type="submit">Join the Squad!</button>
        </form>
        <div class="footer">[Powered by Free Fire - Survive & Conquer]</div>
    </div>

    <script>
        const signinBtn = document.getElementById('signin-btn');
        const signupBtn = document.getElementById('signup-btn');
        const signinForm = document.getElementById('signin-form');
        const signupForm = document.getElementById('signup-form');

        signinBtn.addEventListener('click', () => {
            signinBtn.classList.add('active');
            signupBtn.classList.remove('active');
            signinForm.classList.add('active');
            signupForm.classList.remove('active');
        });

        signupBtn.addEventListener('click', () => {
            signupBtn.classList.add('active');
            signinBtn.classList.remove('active');
            signupForm.classList.add('active');
            signinForm.classList.remove('active');
        });
    </script>
</body>
</html>
